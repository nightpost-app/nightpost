[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.93.1"
publish = false

# The tests derive a real Argon2id key (64 MiB); unoptimised that is seconds
# per call.
[profile.dev.package.argon2]
opt-level = 3
