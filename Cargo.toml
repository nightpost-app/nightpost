[workspace]
resolver = "3"
members = ["crates/*"]
# Built only as a [patch] of a dependency; its own tests run in CI on Windows.
exclude = ["patches"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.93.1"
publish = false

# The tests derive a real Argon2id key (64 MiB); unoptimised that is seconds
# per call.
[profile.dev.package.argon2]
opt-level = 3

# Full debug info for our crates only: with the dependencies' too, each
# binary weighed ~450 MB and linking it took most of a rebuild.
[profile.dev.package."*"]
debug = false

[patch.crates-io]
# saturating-time 0.5.0 (pulled in by tor-netdoc) never returns on Windows: it
# halves a step down to 1 ns while Windows counts in 100 ns, so the last steps
# change nothing and the loop never ends. The copy under patches/ stops when a
# step no longer changes the value. Drop it once upstream has the fix.
saturating-time = { path = "patches/saturating-time" }

# Programs a third the size to download; a panic still says where.
[profile.release]
strip = true
