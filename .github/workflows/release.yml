name: Release
# Runs on a signed tag such as v0.1.0-alpha.1. macOS comes later.
on:
  push:
    tags: ["v*"]
  # A dry run of every build, from the Actions tab: nothing is published.
  workflow_dispatch:
permissions:
  contents: read
env:
  TOR_BUNDLE: "15.0.24"
jobs:
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libx11-dev libxtst-dev libxinerama-dev libxkbcommon-dev libxi-dev libayatana-appindicator3-dev gnupg
        # A mirror that stops answering kept apt retrying for 2 hours.
        timeout-minutes: 10
      - uses: Swatinem/rust-cache@v2
      - name: Fetch lyrebird (signed by the Tor Browser developers)
        if: matrix.arch == 'x86_64'
        run: packaging/fetch-lyrebird.sh linux-x86_64
      # Tor ships no lyrebird for Linux on ARM: the version in its x86_64
      # bundle (same dependencies), built from that commit.
      - uses: actions/setup-go@v6
        if: matrix.arch == 'aarch64'
        with: { go-version: "1.25", cache: false }
      - name: Build lyrebird 0.8.1
        if: matrix.arch == 'aarch64'
        run: |
          git clone -q https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird.git lb
          git -C lb checkout -q 0b10edbb61e0ca6fb70c7d57aeaabf315f1fade1
          (cd lb && CGO_ENABLED=0 go build -trimpath -ldflags=-s -o ../lyrebird ./cmd/lyrebird)
      - name: libxdo, linked in
        # Distributions ship libxdo.so.3 (Ubuntu, Debian, Fedora) or .so.4
        # (Arch, openSUSE): built in, the window needs neither.
        run: |
          x=xdotool-3.20211022.1
          curl -fsSLO https://github.com/jordansissel/xdotool/releases/download/v3.20211022.1/$x.tar.gz
          echo "96f0facfde6d78eacad35b91b0f46fecd0b35e474c03e00e30da3fdd345f9ada  $x.tar.gz" | sha256sum -c
          tar xzf $x.tar.gz && make -C $x libxdo.a
          mkdir -p .cargo && cat >> .cargo/config.toml <<EOF
          [target.${{ matrix.arch }}-unknown-linux-gnu.xdo]
          rustc-link-search = ["$PWD/$x"]
          rustc-link-lib = ["static=xdo", "X11", "Xtst", "Xinerama", "xkbcommon", "Xi"]
          EOF
      - run: cargo build --release --workspace --locked
      - name: Check nightpost-gui needs no libxdo
        run: "! ldd target/release/nightpost-gui | grep libxdo"
      - name: Archive
        run: |
          d=nightpost; mkdir $d
          cp target/release/nightpost target/release/nightpost-gui lyrebird $d/
          cp LICENSE $d/LICENSE.txt; cp docs/lyrebird.txt $d/LICENSE-lyrebird.txt; cp docs/xdotool.txt $d/LICENSE-xdotool.txt; cp docs/bridges.md $d/BRIDGES.md
          mkdir out; tar czf out/nightpost-linux-${{ matrix.arch }}.tar.gz $d
      - name: Packages
        run: |
          cp lyrebird target/release/lyrebird
          cargo install cargo-deb cargo-generate-rpm --locked
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          rv=${v/-/\~}
          # nightpost (window) needs nightpost-cli (daemon) of the very same version.
          sed -i "s/{version}/$rv-1/" crates/gui/Cargo.toml
          for p in nightpost nightpost-gui; do cargo deb -p $p --no-build -o out/; done
          for c in cli gui; do cargo generate-rpm -p crates/$c -s "version = \"$rv\"" -s 'release = "1"' -o out/; done
          # openSUSE names the same libraries differently.
          mkdir out/opensuse
          cargo generate-rpm -p crates/cli -s "version = \"$rv\"" -s 'release = "1"' -s 'requires = { liblzma5 = "*" }' -o out/opensuse/
          cargo generate-rpm -p crates/gui -s "version = \"$rv\"" -s 'release = "1"' -o out/opensuse/ \
            -s "requires = { nightpost-cli = \"= $rv-1\", libwebkit2gtk-4_1-0 = \"*\", libXtst6 = \"*\", liblzma5 = \"*\", libayatana-appindicator3-1 = \"*\" }"
          a=${{ matrix.arch }}
          for f in out/opensuse/*.rpm; do mv "$f" "out/$(basename "$f" .$a.rpm).opensuse.$a.rpm"; done
          rmdir out/opensuse
      - uses: actions/upload-artifact@v6
        with: { name: "linux-${{ matrix.arch }}", path: out/* }

  flatpak:
    # Built offline from vendored crates, as Flathub does; WebKit comes from the GNOME runtime.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder gnupg protobuf-compiler
        # A mirror that stops answering kept apt retrying for 2 hours.
        timeout-minutes: 10
      - name: Fetch lyrebird (signed by the Tor Browser developers)
        run: packaging/fetch-lyrebird.sh linux-x86_64
      - name: Sources
        run: |
          mkdir fp && cp lyrebird packaging/linux/flatpak/*.yml fp/
          git clone --depth 1 https://github.com/flathub/shared-modules.git fp/shared-modules
          rsync -a --exclude .git --exclude target ./ fp/src/
          (cd fp/src && mkdir .cargo && cargo vendor --locked vendor > .cargo/config.toml)
      - name: Build
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          cd fp && flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub --repo=repo build io.github.nightpost_app.Nightpost.yml
          mkdir ../out && flatpak build-bundle repo ../out/nightpost-x86_64.flatpak io.github.nightpost_app.Nightpost
      - uses: actions/upload-artifact@v6
        with: { name: flatpak, path: out/* }

  windows:
    # Cross-built from Linux (mingw-w64): OpenSSL is compiled from source and
    # the perl of the Windows runners lacks modules its Configure needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-gnu }
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler gcc-mingw-w64-x86-64 nsis zip gnupg
        # A mirror that stops answering kept apt retrying for 2 hours.
        timeout-minutes: 10
      - uses: Swatinem/rust-cache@v2
      - name: Fetch lyrebird (signed by the Tor Browser developers)
        run: packaging/fetch-lyrebird.sh windows-x86_64
      - run: cargo build --release --workspace --locked --target x86_64-pc-windows-gnu
      - name: Zip and installer
        run: |
          t=target/x86_64-pc-windows-gnu/release
          d=dist; mkdir $d out
          cp $t/nightpost.exe $t/nightpost-gui.exe lyrebird.exe $d/
          # the GUI loads this dll at run time in windows-gnu builds
          cp "$(find $t -name WebView2Loader.dll | head -1)" $d/
          cp LICENSE $d/LICENSE.txt; cp docs/lyrebird.txt $d/LICENSE-lyrebird.txt; cp docs/bridges.md $d/BRIDGES.md
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          (cd dist && zip -qr ../out/nightpost-windows-x86_64.zip .)
          # Without the window: daemon, command line and terminal interface.
          mkdir cli && cp $t/nightpost.exe lyrebird.exe dist/LICENSE.txt dist/LICENSE-lyrebird.txt dist/BRIDGES.md cli/
          (cd cli && zip -qr ../out/nightpost-cli-windows-x86_64.zip .)
          # NSIS wants a numeric version
          makensis -DVERSION="${v%%-*}" -DDIST="$PWD/dist" -DOUT="$PWD/out/nightpost-setup-x86_64.exe" packaging/windows/nightpost.nsi
      - uses: actions/upload-artifact@v6
        with: { name: windows, path: out/* }

  macos:
    # The command line only: the app (SwiftUI) is still built by hand.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install protobuf gnupg
      - uses: Swatinem/rust-cache@v2
      - name: Fetch lyrebird (signed by the Tor Browser developers)
        run: packaging/fetch-lyrebird.sh macos-aarch64
      - run: cargo build --release -p nightpost --locked
      - name: Archive
        run: |
          d=nightpost-cli; mkdir $d out
          cp target/release/nightpost lyrebird $d/
          cp LICENSE $d/LICENSE.txt; cp docs/lyrebird.txt $d/LICENSE-lyrebird.txt; cp docs/bridges.md $d/BRIDGES.md
          tar czf out/nightpost-cli-macos-aarch64.tar.gz $d
      - uses: actions/upload-artifact@v6
        with: { name: macos, path: out/* }

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, flatpak, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with: { subject-path: "out/*" }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $pre
