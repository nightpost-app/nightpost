name: Release
# Runs on a signed tag such as v0.1.0-alpha.1. macOS comes later.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  TOR_BUNDLE: "15.0.24"
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev gnupg
      - uses: Swatinem/rust-cache@v2
      - name: Fetch lyrebird (signed by the Tor Browser developers)
        run: packaging/fetch-lyrebird.sh linux-x86_64
      - run: cargo build --release --workspace --locked
      - name: Archive
        run: |
          d=nightpost; mkdir $d
          cp target/release/nightpost target/release/nightpost-gui lyrebird $d/
          cp LICENSE $d/LICENSE.txt; cp docs/lyrebird.txt $d/LICENSE-lyrebird.txt; cp docs/bridges.md $d/BRIDGES.md
          mkdir out; tar czf out/nightpost-linux-x86_64.tar.gz $d
      - name: Packages
        run: |
          cp lyrebird target/release/lyrebird
          cargo install cargo-deb cargo-generate-rpm --locked
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          rv=${v/-/\~}
          # nightpost (window) needs nightpost-cli (daemon) of the very same version.
          sed -i "s/{version}/$rv-1/" crates/gui/Cargo.toml
          for p in nightpost nightpost-gui; do cargo deb -p $p --no-build -o out/; done
          for c in cli gui; do cargo generate-rpm -p crates/$c -s "version = \"$rv\"" -s 'release = "1"' -o out/; done
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/* }

  flatpak:
    # Built offline from vendored crates, as Flathub does; WebKit comes from the GNOME runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder gnupg protobuf-compiler
      - name: Fetch lyrebird (signed by the Tor Browser developers)
        run: packaging/fetch-lyrebird.sh linux-x86_64
      - name: Sources
        run: |
          mkdir fp && cp lyrebird packaging/linux/flatpak/*.yml fp/
          git clone --depth 1 https://github.com/flathub/shared-modules.git fp/shared-modules
          rsync -a --exclude .git --exclude target ./ fp/src/
          (cd fp/src && mkdir .cargo && cargo vendor --locked vendor > .cargo/config.toml)
      - name: Build
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          cd fp && flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub --repo=repo build io.github.nightpost_app.Nightpost.yml
          mkdir ../out && flatpak build-bundle repo ../out/nightpost-x86_64.flatpak io.github.nightpost_app.Nightpost
      - uses: actions/upload-artifact@v4
        with: { name: flatpak, path: out/* }

  windows:
    # Cross-built from Linux (mingw-w64): OpenSSL is compiled from source and
    # the perl of the Windows runners lacks modules its Configure needs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-gnu }
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler gcc-mingw-w64-x86-64 nsis zip gnupg
      - uses: Swatinem/rust-cache@v2
      - name: Fetch lyrebird (signed by the Tor Browser developers)
        run: packaging/fetch-lyrebird.sh windows-x86_64
      - run: cargo build --release --workspace --locked --target x86_64-pc-windows-gnu
      - name: Zip and installer
        run: |
          t=target/x86_64-pc-windows-gnu/release
          d=dist; mkdir $d out
          cp $t/nightpost.exe $t/nightpost-gui.exe lyrebird.exe $d/
          # the GUI loads this dll at run time in windows-gnu builds
          cp "$(find $t -name WebView2Loader.dll | head -1)" $d/
          cp LICENSE $d/LICENSE.txt; cp docs/lyrebird.txt $d/LICENSE-lyrebird.txt; cp docs/bridges.md $d/BRIDGES.md
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          (cd dist && zip -qr ../out/nightpost-windows-x86_64.zip .)
          # Without the window: daemon, command line and terminal interface.
          mkdir cli && cp $t/nightpost.exe lyrebird.exe dist/LICENSE.txt dist/LICENSE-lyrebird.txt dist/BRIDGES.md cli/
          (cd cli && zip -qr ../out/nightpost-cli-windows-x86_64.zip .)
          # NSIS wants a numeric version
          makensis -DVERSION="${v%%-*}" -DDIST="$PWD/dist" -DOUT="$PWD/out/nightpost-setup-x86_64.exe" packaging/windows/nightpost.nsi
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  macos:
    # The command line only: the app (SwiftUI) is still built by hand.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install protobuf gnupg
      - uses: Swatinem/rust-cache@v2
      - name: Fetch lyrebird (signed by the Tor Browser developers)
        run: packaging/fetch-lyrebird.sh macos-aarch64
      - run: cargo build --release -p nightpost --locked
      - name: Archive
        run: |
          d=nightpost-cli; mkdir $d out
          cp target/release/nightpost lyrebird $d/
          cp LICENSE $d/LICENSE.txt; cp docs/lyrebird.txt $d/LICENSE-lyrebird.txt; cp docs/bridges.md $d/BRIDGES.md
          tar czf out/nightpost-cli-macos-aarch64.tar.gz $d
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/* }

  publish:
    needs: [linux, flatpak, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "out/*" }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $pre
