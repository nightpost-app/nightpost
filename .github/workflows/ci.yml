name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # OpenSSL is linked statically without its debug files: thousands of
      # LNK4099 lines on Windows, none of them about our code.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C link-arg=/IGNORE:4099' || '' }}
      # block 0.1.6 comes in with the window's macOS side (dioxus-desktop,
      # cocoa): nothing to do here until they move on.
      CARGO_FUTURE_INCOMPAT_REPORT_FREQUENCY: never
      # Without debug files (huge on Windows) linking is faster and the
      # cache lighter; nothing here is run in a debugger.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # libsignal compiles its protobufs with protoc at build time; the
      # graphical interface links the system webview (WebKitGTK on Linux).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libxdo-dev
        # A mirror that stops answering kept apt retrying for 2 hours.
        timeout-minutes: 10
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - if: runner.os == 'Windows'
        run: choco install protoc -y
      # SQLCipher and its OpenSSL are compiled from source: minutes per build
      # without a cache.
      - uses: Swatinem/rust-cache@v2
        with:
          # Branches and pull requests read it, only main writes it: the
          # repository's 10 GB of cache holds one per system, not one per push.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The saturating-time fix only matters on Windows, and its test with it.
      - if: runner.os == 'Windows'
        run: cargo test --manifest-path patches/saturating-time/Cargo.toml
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libxdo-dev
        # A mirror that stops answering kept apt retrying for 2 hours.
        timeout-minutes: 10
      - name: Check with the declared rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --all-targets --locked
