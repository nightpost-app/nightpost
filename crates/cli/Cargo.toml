[package]
name = "nightpost"
description = "Nightpost daemon, command line and terminal interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
nightpost-core = { path = "../core" }
anyhow = "1"
directories = "6"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
