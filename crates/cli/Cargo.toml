[package]
name = "nightpost"
description = "Nightpost daemon, command line and terminal interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
nightpost-core = { path = "../core" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
# The terminal interface. Line counts of wrapped paragraphs (to keep the
# conversation scrolled to its end) are behind ratatui's unstable flag.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
unicode-width = "0.2"
# Local time for message timestamps.
jiff = "0.2"
# Invitation links as a QR code in characters; no image support needed.
qrcode = { version = "0.14", default-features = false }
data-encoding = "2"
# The passphrase typed at a terminal, without echo.
rpassword = "7"
zeroize = "1"

# The daemon's own notifications while no interface is open (on macOS the app
# stays open instead).
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

# The package without the window, for a server or a mailbox: no WebKit, no GTK.
# The `nightpost` package (crates/gui) is the full one and depends on this.
# lyrebird goes outside the PATH, where it cannot clash with a distribution's
# own; nightpost looks there too.
[package.metadata.deb]
name = "nightpost-cli"
maintainer = "Nightpost <312234885+murmure-dev@users.noreply.github.com>"
copyright = "Nightpost contributors"
license-file = ["../../LICENSE", "0"]
extended-description = "The Nightpost daemon, command line and terminal interface, without the window. Nightpost is a messenger with no server in the middle: each person's Nightpost is a Tor onion service only their contacts can find, and messages are end-to-end encrypted with Signal's protocol."
section = "net"
depends = "$auto"
# /usr/bin/nightpost belonged to the `nightpost` package of 0.1.0-alpha.1.
replaces = "nightpost (<< 0.1.0~alpha.2)"
breaks = "nightpost (<< 0.1.0~alpha.2)"
assets = [
    ["target/release/nightpost", "usr/bin/", "755"],
    ["target/release/lyrebird", "usr/libexec/nightpost/", "755"],
    ["../../docs/lyrebird.txt", "usr/share/doc/nightpost-cli/LICENSE-lyrebird", "644"],
    ["../../packaging/linux/nightpost-mailbox.service", "lib/systemd/system/", "644"],
    ["../../docs/mailbox.md", "usr/share/doc/nightpost-cli/MAILBOX.md", "644"],
]

[package.metadata.generate-rpm]
name = "nightpost-cli"
summary = "Nightpost without the window: daemon, command line and terminal interface"
auto-req = "disabled"
assets = [
    { source = "target/release/nightpost", dest = "/usr/bin/nightpost", mode = "755" },
    { source = "target/release/lyrebird", dest = "/usr/libexec/nightpost/lyrebird", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/nightpost-cli/LICENSE", mode = "644", doc = true },
    { source = "../../docs/lyrebird.txt", dest = "/usr/share/licenses/nightpost-cli/LICENSE-lyrebird", mode = "644", doc = true },
    { source = "../../packaging/linux/nightpost-mailbox.service", dest = "/usr/lib/systemd/system/nightpost-mailbox.service", mode = "644" },
    { source = "../../docs/mailbox.md", dest = "/usr/share/doc/nightpost-cli/MAILBOX.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
xz-libs = "*"

# /usr/bin/nightpost belonged to the `nightpost` package of 0.1.0-alpha.1.
[package.metadata.generate-rpm.conflicts]
nightpost = "< 0.1.0~alpha.2"
