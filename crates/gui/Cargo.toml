[package]
name = "nightpost-gui"
description = "Nightpost graphical interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
nightpost-core = { path = "../core" }
# Desktop only: a native window around the system webview (WebKitGTK on
# Linux, WKWebView on macOS, WebView2 on Windows). No npm, no JavaScript of
# ours: the interface is Rust.
dioxus = { version = "0.7", features = ["desktop"] }
anyhow = "1"
tokio = { version = "1", features = ["rt", "time"] }
# System notifications (D-Bus on Linux, pure Rust).
notify-rust = "4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
data-encoding = "2"
zeroize = "1"
# Decodes a picked photo so only our own re-encoded PNG reaches the page
# (already built for the window icon by dioxus-desktop).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jiff = "0.2"
