[package]
name = "nightpost-gui"
description = "Nightpost graphical interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
nightpost-core = { path = "../core" }
# Desktop only: a native window around the system webview (WebKitGTK on
# Linux, WKWebView on macOS, WebView2 on Windows). No npm, no JavaScript of
# ours: the interface is Rust.
dioxus = { version = "0.7", features = ["desktop"] }
anyhow = "1"
tokio = { version = "1", features = ["rt", "time"] }
# System notifications (D-Bus on Linux, pure Rust).
notify-rust = "4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
data-encoding = "2"
zeroize = "1"
# Decodes a picked photo so only our own re-encoded PNG reaches the page
# (already built for the window icon by dioxus-desktop).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jiff = "0.2"

# The icon inside nightpost-gui.exe (build.rs). A build dependency runs on
# the machine that builds, so it cannot be limited to Windows targets here.
[build-dependencies]
winresource = "0.1"

# The window's round corners are cut out by GTK itself (chrome.rs); the same
# version as the one under dioxus-desktop.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# The Linux packages, both named nightpost: `cargo deb -p nightpost-gui` and
# `cargo generate-rpm -p crates/gui`, after `cargo build --release` and with
# lyrebird copied to target/release. lyrebird goes outside the PATH, where
# it cannot clash with a distribution's own; nightpost looks there too.
[package.metadata.deb]
name = "nightpost"
maintainer = "Nightpost <312234885+murmure-dev@users.noreply.github.com>"
copyright = "Nightpost contributors"
license-file = ["../../LICENSE", "0"]
extended-description = "A messenger with no server in the middle: each person's Nightpost is a Tor onion service only their contacts can find, and messages are end-to-end encrypted with Signal's protocol."
section = "net"
depends = "$auto"
assets = [
    ["target/release/nightpost", "usr/bin/", "755"],
    ["target/release/nightpost-gui", "usr/bin/", "755"],
    ["target/release/lyrebird", "usr/libexec/nightpost/", "755"],
    ["../../packaging/linux/io.github.nightpost-app.Nightpost.desktop", "usr/share/applications/", "644"],
    ["../../icons/nightpost.png", "usr/share/icons/hicolor/256x256/apps/io.github.nightpost-app.Nightpost.png", "644"],
    ["../../docs/lyrebird.txt", "usr/share/doc/nightpost/LICENSE-lyrebird", "644"],
]

[package.metadata.generate-rpm]
name = "nightpost"
summary = "Messages over Tor, with no server in the middle"
# Found by the tool, the requirements are every library down the tree under
# the building system's names (libicuuc.so.76…), which another Fedora may
# not have: the two below bring the rest.
auto-req = "disabled"
assets = [
    { source = "target/release/nightpost", dest = "/usr/bin/nightpost", mode = "755" },
    { source = "target/release/nightpost-gui", dest = "/usr/bin/nightpost-gui", mode = "755" },
    { source = "target/release/lyrebird", dest = "/usr/libexec/nightpost/lyrebird", mode = "755" },
    { source = "../../packaging/linux/io.github.nightpost-app.Nightpost.desktop", dest = "/usr/share/applications/io.github.nightpost-app.Nightpost.desktop", mode = "644" },
    { source = "../../icons/nightpost.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.nightpost-app.Nightpost.png", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/nightpost/LICENSE", mode = "644", doc = true },
    { source = "../../docs/lyrebird.txt", dest = "/usr/share/licenses/nightpost/LICENSE-lyrebird", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
"webkit2gtk4.1" = "*"
libxdo = "*"
xz-libs = "*"
