[package]
name = "nightpost-core"
description = "Nightpost engine: identity, encryption, Tor transport, storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Not on crates.io: Signal publishes it only as a git repository. Pinned to a
# tag, so a build is the same code every time. Brings PQXDH and the Triple
# Ratchet (SPQR) for 1:1 sessions.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.0" }
# The libsignal store traits are async(?Send); implementing them needs the
# same macro.
async-trait = "0.1"
# libsignal's own version: its functions take an RNG with this rand's traits.
rand = "0.9"
# SQLCipher compiled from source, with OpenSSL compiled from source too: no
# system library to install on any of the three platforms.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.6"
# Where the database secret lives by default: the OS keychain (Secret Service
# over D-Bus on Linux, Keychain on macOS, Credential Manager on Windows).
# zbus is pure Rust, so no libdbus to install at build time.
keyring = "4"
hkdf = "0.13"
sha2 = "0.11"
zeroize = "1"
# Wire format: compact, no schema to ship, and postcard bounds nothing by
# itself, so every decoder here bounds its input first.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
# Base32 for invitation links: case-insensitive, no characters a QR code or
# a hand copy confuses.
data-encoding = "2"

[dev-dependencies]
futures = "0.3"
tempfile = "3"
